name: ScanPadde V2
version: "0.1.16"
slug: scanpadde_v2
description: Local, persistent structural document intake. Experimental Phase 1A.
arch:
  - amd64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:file-document-multiple-outline
panel_admin: true
map:
  - type: share
    read_only: false
  # Supervisor creates the app-specific public configuration directory and
  # mounts it at /config. It is the sole filesystem source for the public CA.
  - type: addon_config
    read_only: false
backup: cold
timeout: 30
stage: experimental
options:
  ocr_backend: disabled
  ocr_worker_url: ""
  # Relative to the Supervisor-provided /config mount; never an arbitrary host path.
  ocr_worker_ca: ""
  ocr_worker_token: ""
  # Optional private-LAN Ollama endpoint for non-authoritative review suggestions.
  ollama_enabled: false
  ollama_url: ""
  ollama_model: ""
schema:
  ocr_backend: list(disabled|local|remote)
  ocr_worker_url: str?
  ocr_worker_ca: str?
  ocr_worker_token: password?
  ollama_enabled: bool
  ollama_url: str?
  ollama_model: str?
